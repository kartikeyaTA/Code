trigger:
  branches:
    include:
      - dev

pool:
  vmImage: 'ubuntu-latest'

# pool:
#   name: $(agentPoolName)

variables:
  - name: azureServiceConnection
    value: 'sc-azure-dev-backend'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/backend/Dockerfile'
  - name: buildContext
    value: '$(Build.SourcesDirectory)/backend'
  - name: acrName
    value: '$(Build.SourcesDirectory)/backend'
  - name: imageRepository
    value: '$(Build.SourcesDirectory)/backend'

stages:
- stage: Build_Test_Scan_And_Publish
  displayName: 'CI: Test, Build, Scan & Package'
  jobs:
  - job: BuildJob
    displayName: 'Python CI Workflow Execution'
    steps:

    - script: |
        echo "Creating Python Virtual Environment..."
        if [ ! -d ".venv" ]; then
          echo "Creating Python Virtual Environment..."
          python3 -m venv .venv
        else
          echo "Virtual environment .venv already exists. Skipping creation..."
        fi
        source .venv/bin/activate

        echo "Upgrading pip and installing test dependencies..."
        python -m pip install --upgrade pip
        pip install pytest pytest-cov

        echo "Installing application dependencies..."
        if [ -f backend/requirements.txt ]; then
          pip install -r backend/requirements.txt
        else
          echo "No requirements.txt found in backend directory, skipping pip install."
        fi

        echo "Executing Pytest..."
        # Runs pytest on backend directory, generates JUnit XML report for Azure DevOps
        pytest backend/ \
          --cov=backend \
          --cov-report=xml:coverage.xml \
          --cov-fail-under=80 \
          --junitxml=test-results.xml
      displayName: 'Execute Python Unit Tests'

    - task: PublishTestResults@2
      displayName: 'Publish Pytest Results'
      condition: succeededOrFailed() 
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/test-results.xml'
        testRunTitle: 'Backend Python Unit Tests'

    - script: |
        SHORT_SHA=$(echo $(Build.SourceVersion) | cut -c1-7)
        TAG="sha-${SHORT_SHA}"
        FULL_IMAGE="$(acrName).azurecr.io/$(imageRepository):${TAG}"

        echo "##vso[task.setvariable variable=tag]${TAG}"
        echo "##vso[task.setvariable variable=fullImage]${FULL_IMAGE}"

        echo "Initialized Global Variables:"
        echo "TAG = ${tag}"
        echo "FULL_IMAGE = ${fullImage}"
      displayName: 'Set Global Image Variables'

    - task: AzureCLI@2
      displayName: 'Build and Push Docker Image'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Logging into ACR: $(acrName)..."
          az acr login --name $(acrName)

          echo "Building Docker Image: ${fullImage}"
          docker build -t $fullImage -f $(dockerfilePath) $(buildContext)
    
    - script: |
        echo "Installing Trivy Vulnerability Scanner..."
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

        echo "Downloading official HTML template..."
        curl -sL -o html.tpl https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl

        echo "Preparing report directory..."
        mkdir -p $(Build.ArtifactStagingDirectory)/trivy-reports

        echo "Generating full HTML vulnerability report (All Severities)..."
        trivy image \
          --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
          --format template \
          --template "@html.tpl" \
          -o $(Build.ArtifactStagingDirectory)/trivy-reports/trivy-report.html \
          $fullImage

        echo "Counting combined HIGH and CRITICAL vulnerabilities..."
        VULN_JSON=$(trivy image --severity HIGH,CRITICAL --format json $fullImage)
        TOTAL_COUNT=$(echo "$VULN_JSON" | jq '[.Results[].Vulnerabilities[]?] | length')

        echo "----------------------------------------------------"
        echo "Security Gate Summary:"
        echo "Total HIGH + CRITICAL Vulnerabilities Found: $TOTAL_COUNT"
        echo "Allowed Threshold: < 5"
        echo "----------------------------------------------------"

        if [ "$TOTAL_COUNT" -ge 5 ]; then
          echo "Security Gate Failed: Found $TOTAL_COUNT High/Critical vulnerabilities (Threshold is < 5)."
          exit 1
        else
          echo "Security Gate Passed: $TOTAL_COUNT High/Critical vulnerabilities found (Below threshold of 5)."
        fi
      displayName: 'Trivy Local Security Gate Scan'

    - publish: $(Build.ArtifactStagingDirectory)/trivy-reports
      artifact: trivy-security-report
      displayName: 'Publish Trivy Report Artifact'
      condition: always()
    
    - task: AzureCLI@2
      displayName: '6. Push Approved Image to ACR'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Logging into ACR: $(acrName)..."
          az acr login --name $(acrName)

          echo "Pushing Image to ACR: ${fullImage}"
          docker push $fullImage

          mkdir -p $(Build.ArtifactStagingDirectory)/metadata
          echo "$(tag)" > $(Build.ArtifactStagingDirectory)/metadata/image_tag.txt

    - publish: $(Build.ArtifactStagingDirectory)/metadata
      artifact: image-metadata
      displayName: '8. Publish Image Tag Artifact for CD'
