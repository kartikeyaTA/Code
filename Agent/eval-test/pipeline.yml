trigger:
  branches:
    include:
      - main

variables:
  AzureSubscription: 'Your-Azure-Service-Connection'
  AzureAIProjectEndpoint: 'https://txrh-foundry.services.ai.azure.com/api/projects/txrh-project'
  DeploymentName: 'gpt-5.4'
  DatasetPath: '$(System.DefaultWorkingDirectory)/snow_eval_dataset.json'
  AccuracyThreshold: '0.80' # Minimum 80% passing score requirement

jobs:
- job: EvaluateAndPublishPrompt
  displayName: 'Offline Agent Prompt Quality Gate'
  pool:
    vmImage: 'ubuntu-latest'

  steps:
  # --------------------------------------------------------------------------
  # STEP 1: CREATE EVAL AGENT
  # --------------------------------------------------------------------------
  - task: AzureCLI@2
    displayName: '1. Create Candidate Eval Agent'
    inputs:
      azureSubscription: '$(AzureSubscription)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        python3 create_eval_agent.py

  # --------------------------------------------------------------------------
  # STEP 2: RUN EVALS
  # --------------------------------------------------------------------------
  - task: AIAgentEvaluation@2
    name: RunEvaluationTask
    displayName: '2. Run AI Agent Evaluation'
    inputs:
      azure-ai-project-endpoint: '$(AzureAIProjectEndpoint)'
      deployment-name: '$(DeploymentName)'
      data-path: '$(DatasetPath)'
      agent-ids: '$(CandidateAgentName):$(CandidateAgentVersion)'

  # --------------------------------------------------------------------------
  # STEP 3: CHECK THRESHOLDS
  # --------------------------------------------------------------------------
  - task: PowerShell@2
    displayName: '3. Enforce Metric Threshold Gate'
    inputs:
      targetType: 'inline'
      script: |
        # Parse evaluation metrics summary generated by AIAgentEvaluation task
        Write-Host "Evaluating agent run against accuracy threshold: $(AccuracyThreshold)"
        
        # Pull task result status
        $taskStatus = "$(AgentJobStatus)"
        
        if ($taskStatus -ne "Succeeded") {
            Write-Error "❌ Quality Gate Failed: Evaluation task did not pass minimum performance criteria."
            exit 1
        } else {
            Write-Host "✅ Quality Gate Passed: Evaluation metrics met or exceeded threshold."
        }

  # --------------------------------------------------------------------------
  # STEP 4: PUBLISH REPORTS
  # --------------------------------------------------------------------------
  - task: PublishBuildArtifacts@1
    displayName: '4. Publish Evaluation Reports'
    condition: always() # Publish reports even if evaluation step failed
    inputs:
      PathtoPublish: '$(System.DefaultWorkingDirectory)/snow_eval_dataset.json'
      ArtifactName: 'Evaluation-Summary-Report'
      publishLocation: 'Container'

  # --------------------------------------------------------------------------
  # STEP 5: DELETE EVAL AGENT
  # --------------------------------------------------------------------------
  - task: AzureCLI@2
    displayName: '5. Delete Candidate Eval Agent'
    condition: always() # 👈 Guarantees cleanup even if evaluation or threshold steps fail
    inputs:
      azureSubscription: '$(AzureSubscription)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        EVAL_PASSED="false"
        if [ "$(AgentJobStatus)" == "Succeeded" ]; then
          EVAL_PASSED="true"
        fi
        python3 cleanup_eval_agent.py 