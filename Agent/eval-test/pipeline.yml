trigger:
  branches:
    include:
      - main

variables:
  AzureSubscription: 'Your-Azure-Service-Connection'
  AzureAIProjectEndpoint: 'https://txrh-foundry.services.ai.azure.com/api/projects/txrh-project'
  DeploymentName: 'gpt-5.4'
  DatasetPath: '$(System.DefaultWorkingDirectory)/snow_eval_dataset.json'

jobs:
- job: EvaluateAndPublishPrompt
  displayName: 'Offline Agent Prompt Quality Gate'
  pool:
    vmImage: 'ubuntu-latest' # Linux Ubuntu Runner

  steps:
  # --------------------------------------------------------------------------
  # STEP 0: SETUP PYTHON ENVIRONMENT ON UBUNTU
  # --------------------------------------------------------------------------
  - task: UsePythonVersion@0
    displayName: '0. Set Python Version'
    inputs:
      versionSpec: '3.10'
      addToPath: true

  - script: |
      python3 -m pip install --upgrade pip
      pip install azure-ai-projects azure-identity azure-core
    displayName: '0. Install Python Dependencies'

  # --------------------------------------------------------------------------
  # STEP 1: CREATE EVAL AGENT
  # --------------------------------------------------------------------------
  - task: AzureCLI@2
    displayName: '1. Create Candidate Eval Agent'
    inputs:
      azureSubscription: '$(AzureSubscription)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        python3 create_eval_agent.py

  # --------------------------------------------------------------------------
  # STEP 2: RUN EVALS
  # --------------------------------------------------------------------------
  - task: AIAgentEvaluation@2
    name: RunEvaluationTask
    displayName: '2. Run AI Agent Evaluation'
    inputs:
      azure-ai-project-endpoint: '$(AzureAIProjectEndpoint)'
      deployment-name: '$(DeploymentName)'
      data-path: '$(DatasetPath)'
      agent-ids: '$(CandidateAgentName):$(CandidateAgentVersion)'

  # --------------------------------------------------------------------------
  # STEP 3: CHECK THRESHOLDS
  # --------------------------------------------------------------------------
  - script: |
      echo "Checking evaluation status for job..."
      if [ "$(AgentJobStatus)" != "Succeeded" ]; then
        echo "❌ Quality Gate Failed: Evaluation task did not pass performance criteria."
        exit 1
      fi
      echo "✅ Quality Gate Passed: Evaluation metrics met required thresholds."
    displayName: '3. Enforce Quality Gate Threshold'

  # --------------------------------------------------------------------------
  # STEP 4: PUBLISH REPORTS
  # --------------------------------------------------------------------------
  - task: PublishBuildArtifacts@1
    displayName: '4. Publish Evaluation Reports'
    condition: always()
    inputs:
      PathtoPublish: '$(DatasetPath)'
      ArtifactName: 'Evaluation-Summary-Report'
      publishLocation: 'Container'

  # --------------------------------------------------------------------------
  # STEP 5: DELETE EVAL AGENT
  # --------------------------------------------------------------------------
  - task: AzureCLI@2
    displayName: '5. Delete Candidate Eval Agent'
    condition: always() # Guarantees execution even if step 2 or 3 fails
    inputs:
      azureSubscription: '$(AzureSubscription)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        EVAL_PASSED="false"
        if [ "$(AgentJobStatus)" == "Succeeded" ]; then
          EVAL_PASSED="true"
        fi
        python3 cleanup_eval_agent.py --eval-passed $EVAL_PASSED