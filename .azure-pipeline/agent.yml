trigger:
  branches:
    include:
      - dev
  paths:
    include:
      - Agent/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'azure-service-connection'
  resourceGroup: 'ai-chatbot-dev3'
  managedIdentityName: 'id-app-gateway-dev' 

stages:
- stage: DeployAgentPrompt
  displayName: 'Sync AI Foundry Agent State'
  jobs:
  - job: PromptSync
    steps:
    
    # 1. Fetch the Managed Identity Client ID dynamically for VNet Auth
    - task: AzureCLI@2
      displayName: 'Fetch Managed Identity Context'
      name: FetchIdentity
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Fetching clientId for identity $(managedIdentityName)..."
          CLIENT_ID=$(az identity show --name "$(managedIdentityName)" --resource-group "$(resourceGroup)" --query clientId -o tsv)
          echo "##vso[task.setvariable variable=DYNAMIC_CLIENT_ID]$CLIENT_ID"

    # 2. Synchronize your Agent Prompt State inside the Private VNet
    - task: AzureCLI@2
      displayName: 'Execute Agent Prompt Upgrade'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(Build.SourcesDirectory)/Agent'
        inlineScript: |
          echo "Installing light python SDK wrappers..."
          pip install --upgrade pip
          pip install azure-ai-projects azure-identity

          echo "Injecting target discovery workspace parameters..."
          export AZURE_AI_FOUNDRY_ENDPOINT="https://eastus2.api.azureml.ms/discovery/scopes/subscriptions/a0c64e05-02e0-4758-891f-e6731cfa3357/resourceGroups/ai-chatbot-dev3/projects/ai-project-chat-dev"
          
          export AZURE_AI_AGENT_NAME="test-agent-1"
          export AGENT_PROMPT_FILE="prompt.txt"
          export AZURE_AI_DEFAULT_MODEL="o4-mini"
          
          # Pass the dynamic pipeline identity Client ID to navigate the network bridge
          export AZURE_CLIENT_ID="$(DYNAMIC_CLIENT_ID)"

          echo "Running Python Agent Engine update..."
          python update_agent.py