trigger:
  branches:
    include:
      - dev
pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'azure-service-connection'
  dockerRegistryConnection: 'acr-docker-service-connection' 
  subscriptionId: 'a0c64e05-02e0-4758-891f-e6731cfa3357'
  acrName: 'aichatregistrydev' 
  imageRepository: 'core-service'
  tag: '$(Build.BuildId)'
  keyVaultName: 'testkaraichat2dev'
  resourceGroup: 'ai-chatbot-dev2'
  containerAppName: 'ca-chat-backend-dev'
  containerAppEnv: 'aca-env-chat-dev' # Explicitly setting this fixes the 'undefined' parsing bug
  envName: 'dev'
  managedIdentityName: 'id-app-gateway-dev' 

stages:
- stage: BuildAndDeploy
  displayName: 'Build, Push, Set Secrets, and Deploy'
  jobs:
  - job: PipelineWorkflow
    steps:
    
    # 1. Build and Push Docker Image to ACR
    - task: Docker@2
      displayName: 'Build and Push Image to ACR'
      inputs:
        containerRegistry: '$(dockerRegistryConnection)'
        repository: '$(imageRepository)'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(tag)
          latest

    # 2. Dynamically fetch Managed Identity Client ID & Set Key Vault Secret
    - task: AzureCLI@2
      displayName: 'Fetch Identity and Update Key Vault'
      name: FetchAzureData
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Fetching Client ID for identity $(managedIdentityName)..."
          CLIENT_ID=$(az identity show --name "$(managedIdentityName)" --resource-group "$(resourceGroup)" --query clientId -o tsv)
          
          echo "##vso[task.setvariable variable=DYNAMIC_CLIENT_ID]$CLIENT_ID"
          
          az keyvault secret set \
            --vault-name "$(keyVaultName)" \
            --name "vault-secret" \
            --value "$(Build.BuildId)"

    - task: AzureCLI@2
      displayName: 'Deploy to Azure Container Apps via Native CLI'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Checking if Container App $(containerAppName) exists..."
          APP_EXISTS=$(az containerapp show --name "$(containerAppName)" --resource-group "$(resourceGroup)" --query name -o tsv 2>/dev/null || echo "not_found")
          
          if [ "$APP_EXISTS" == "not_found" ]; then
            echo "App not found. Performing full creation sequence..."
            az containerapp create \
              --name "$(containerAppName)" \
              --resource-group "$(resourceGroup)" \
              --environment "$(containerAppEnv)" \
              --image "$(acrName).azurecr.io/$(imageRepository):$(tag)" \
              --target-port 80 \
              --ingress internal \
              --transport http \
              --user-assigned "$(DYNAMIC_CLIENT_ID)" \
              --registry-server "$(acrName).azurecr.io" \
              --registry-identity "$(DYNAMIC_CLIENT_ID)" \
              --secrets "vault-secret=keyvault://$(keyVaultName).vault.azure.net/secrets/vault-secret" \
              --env-vars "MY_DUMMY_SECRET=secretref:vault-secret" "STORAGE_ACCOUNT_NAME=stachattranscriptsdev"
          else
            echo "App found. Running dedicated secret update sequence..."
            az containerapp secret set \
              --name "$(containerAppName)" \
              --resource-group "$(resourceGroup)" \
              --secrets "vault-secret=keyvault://$(keyVaultName).vault.azure.net/secrets/vault-secret"

            echo "Upgrading existing container app image and application state seamlessly..."
            az containerapp update \
              --name "$(containerAppName)" \
              --resource-group "$(resourceGroup)" \
              --image "$(acrName).azurecr.io/$(imageRepository):$(tag)" \
              --set-env-vars "AZURE_CLIENT_ID=$(DYNAMIC_CLIENT_ID)" "MY_DUMMY_SECRET=secretref:vault-secret" "STORAGE_ACCOUNT_NAME=stachattranscripts$(envName)"
          fi