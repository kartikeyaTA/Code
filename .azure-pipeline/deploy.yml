trigger:
  branches:
    include:
      - dev

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'azure-service-connection'
  dockerRegistryConnection: 'acr-docker-service-connection' 
  subscriptionId: 'a0c64e05-02e0-4758-891f-e6731cfa3357'
  acrName: 'aichatregistrydev' 
  imageRepository: 'core-service'
  tag: '$(Build.BuildId)'
  keyVaultName: 'testkaraichat2dev'
  resourceGroup: 'ai-chatbot-dev2'
  containerAppName: 'ca-chat-backend-dev'
  containerAppEnv: 'aca-env-chat-dev' 
  envName: 'dev'
  managedIdentityName: 'id-app-gateway-dev' 

stages:
- stage: BuildAndDeploy
  displayName: 'Build, Push, Set Secrets, and Deploy'
  jobs:
  - job: PipelineWorkflow
    steps:
    
    # 1. Build and Push Docker Image to ACR
    - task: Docker@2
      displayName: 'Build and Push Image to ACR'
      inputs:
        containerRegistry: '$(dockerRegistryConnection)'
        repository: '$(imageRepository)'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(tag)
          latest

    # 2. Dynamically fetch Managed Identity Client ID AND Resource ID
    - task: AzureCLI@2
      displayName: 'Fetch Identity and Update Key Vault'
      name: FetchAzureData
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Fetching Identity Details for $(managedIdentityName)..."
          CLIENT_ID=$(az identity show --name "$(managedIdentityName)" --resource-group "$(resourceGroup)" --query clientId -o tsv)
          IDENTITY_RESOURCE_ID=$(az identity show --name "$(managedIdentityName)" --resource-group "$(resourceGroup)" --query id -o tsv)
          
          echo "##vso[task.setvariable variable=DYNAMIC_CLIENT_ID]$CLIENT_ID"
          echo "##vso[task.setvariable variable=DYNAMIC_IDENTITY_RESOURCE_ID]$IDENTITY_RESOURCE_ID"
          
          az keyvault secret set \
            --vault-name "$(keyVaultName)" \
            --name "vault-secret" \
            --value "$(Build.BuildId)"

    # 3. Secure Deployment via Native CLI with Identity Fixed
    - task: AzureCLI@2
      displayName: 'Deploy to Azure Container Apps via Native CLI'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Checking if Container App $(containerAppName) exists and its status..."
          
          # Fetch provisioning state to detect broken configurations
          APP_STATE=$(az containerapp show --name "$(containerAppName)" --resource-group "$(resourceGroup)" --query properties.provisioningState -o tsv 2>/dev/null || echo "not_found")
          echo "Current Container App State: $APP_STATE"

          # Recovery and Routing Logic
          if [ "$APP_STATE" == "not_found" ] || [ "$APP_STATE" == "Failed" ]; then
            if [ "$APP_STATE" == "Failed" ]; then
              echo "Target app is in a failed state due to a previous bad run. Purging broken deployment..."
              az containerapp delete --name "$(containerAppName)" --resource-group "$(resourceGroup)" --yes
            fi

            echo "Performing full creation sequence..."
            az containerapp create \
              --name "$(containerAppName)" \
              --resource-group "$(resourceGroup)" \
              --environment "$(containerAppEnv)" \
              --image "$(acrName).azurecr.io/$(imageRepository):$(tag)" \
              --target-port 80 \
              --ingress external \
              --user-assigned "$DYNAMIC_IDENTITY_RESOURCE_ID" \
              --registry-server "$(acrName).azurecr.io" \
              --registry-identity "$DYNAMIC_IDENTITY_RESOURCE_ID" \
              --secrets "vault-secret=keyvault://$(keyVaultName).vault.azure.net/secrets/vault-secret" \
              --env-vars "AZURE_CLIENT_ID=$DYNAMIC_CLIENT_ID" "MY_DUMMY_SECRET=secretref:vault-secret" "STORAGE_ACCOUNT_NAME=stachattranscripts$(envName)"
          else
            echo "App found and healthy. Running dedicated secret update sequence..."
            az containerapp secret set \
              --name "$(containerAppName)" \
              --resource-group "$(resourceGroup)" \
              --secrets "vault-secret=keyvault://$(keyVaultName).vault.azure.net/secrets/vault-secret"

            echo "Upgrading existing container app image and application state seamlessly..."
            az containerapp update \
              --name "$(containerAppName)" \
              --resource-group "$(resourceGroup)" \
              --image "$(acrName).azurecr.io/$(imageRepository):$(tag)" \
              --user-assigned "$DYNAMIC_IDENTITY_RESOURCE_ID" \
              --registry-server "$(acrName).azurecr.io" \
              --registry-identity "$DYNAMIC_IDENTITY_RESOURCE_ID" \
              --set-env-vars "AZURE_CLIENT_ID=$DYNAMIC_CLIENT_ID" "MY_DUMMY_SECRET=secretref:vault-secret" "STORAGE_ACCOUNT_NAME=stachattranscripts$(envName)"
          fi